services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/pathly.db
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      FRONTEND_URL: http://localhost:5173
    volumes: [pathly_data:/data]
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args: {VITE_API_URL: "http://localhost:8000"}
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {pathly_data: {}}
